# Functional-test values: client auth sourced from a pre-existing Secret
# (config.auth.existingSecret) on a self-contained filesystem backend. The keys in
# the Secret created by the workflow must hold the same identity/secret the smoke
# test signs with; broken wiring leaves s3proxy.identity/credential unset and the
# round-trip fails to authenticate.
config:
  auth:
    type: aws-v4
    existingSecret: s3proxy-auth
    identityKey: accessKeyId
    secretKey: secretAccessKey
  backends:
    filesystem:
      enabled: true
      nio2: true
      basedir: /data/s3proxy
persistence:
  enabled: true
  size: 1Gi
resources:
  requests:
    cpu: 100m
    memory: 256Mi
